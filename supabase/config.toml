project_id = "KMPNews"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

# Local Auth settings only; hosted configuration is applied separately.
[auth]
enabled = true
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8
password_requirements = ""

[auth.rate_limit]
email_sent = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 600

# Local mail stays in the CLI mail catcher. Hosted Gmail credentials are Dashboard-only.
[auth.email.template.confirmation]
subject = "Confirm your KMPNews email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your KMPNews password"
content_path = "./supabase/templates/recovery.html"

[functions.news-feed]
enabled = true
verify_jwt = false
entrypoint = "./functions/news-feed/index.ts"

<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Reset your KMPNews password</title>
    </head>
    <body>
        <h1>Reset your KMPNews password</h1>
        <p>Enter this 6-digit code in KMPNews to reset your password:</p>
        <p style="font-size: 28px; font-weight: bold; letter-spacing: 4px;">{{ .Token }}</p>
        <p>This code expires in 10 minutes. Do not share it with anyone.</p>
        <p>If you did not request a password reset, you can ignore this email. Your password has not changed.</p>
    </body>
</html>

product:
  type: kmp/lib
  platforms: [android, jvm]

dependencies:
  - //sharedLogic
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose

dependencies@android:
  - $compose.uiTooling

settings:
  compose:
    enabled: true
    resources:
      packageName: com.ndynagn.kmp.news.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true

plugins:
  style: enabled
